<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Framework Window</title>
<style>
/* ─── Design Tokens ─────────────────────────────────────────────────── */
:root {
  --bg: #0f0f12;
  --surface: #1a1a1f;
  --surface-raised: #232329;

  --border: rgba(255, 255, 255, 0.12);
  --border-hairline: rgba(255, 255, 255, 0.08);

  --font-1-tone: 89;
  --font-2-tone: 63;
  --text: hsl(0 0% calc(var(--font-1-tone) * 1%));
  --text-muted: hsl(0 0% calc(var(--font-2-tone) * 1%));

  --accent: #3b82f6;

  /* Window */
  --window-bg-h: 230;
  --window-bg-saturation: 12%;
  --window-bg-brightness: 14%;
  --window-bg-alpha: 0.72;
  --window-bg: hsl(var(--window-bg-h) var(--window-bg-saturation) var(--window-bg-brightness) / var(--window-bg-alpha));

  /* Desktop */
  --desktop-bg-color-1: hsl(240 28% 14%);
  --desktop-bg-color-2: hsl(213 73% 22%);

  /* Row / list standards */
  --row-padding-block: 7px;
  --row-padding-inline: 9px;
  --row-gap: 9px;
  --row-min-inner-height: 18px;
  --row-min-height: calc(var(--row-padding-block) * 2 + var(--row-min-inner-height));
  --list-gap: 4px;

  /* Icon button */
  --icon-btn-size: 1.25rem;
  --icon-btn-radius: 4px;
  --icon-btn-icon: 0.9375rem;

  /* Chrome */
  --chrome-height: 2.7rem;

  /* Finder shell */
  --finder-pane-padding: 10px;
}

/* ─── Reset ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  overflow: hidden;
}

/* ─── Desktop ────────────────────────────────────────────────────────── */
.desktop {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, var(--desktop-bg-color-1) 0%, var(--desktop-bg-color-2) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ─── OS Window ──────────────────────────────────────────────────────── */
.os-window {
  position: relative;
  width: min(640px, calc(100vw - 2rem));
  height: min(480px, calc(100vh - 3rem));
  border-radius: 10px;
  background: var(--window-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--border-hairline);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── Window Chrome (title bar) ──────────────────────────────────────── */
.window-chrome {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-height: var(--chrome-height);
  padding: 0.4rem 0.75rem 0.35rem;
  border-bottom: 1px solid var(--border-hairline);
  background: linear-gradient(180deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0.01) 100%);
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

.window-chrome-title {
  margin: 0;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text);
  line-height: 1;
  flex: 1 1 auto;
  min-width: 0;
}

.window-chrome-actions {
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  flex-shrink: 0;
  margin-left: auto;
}

/* ─── Icon Buttons ───────────────────────────────────────────────────── */
.icon-btn {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--icon-btn-size);
  height: var(--icon-btn-size);
  min-width: var(--icon-btn-size);
  min-height: var(--icon-btn-size);
  padding: 0;
  margin: 0;
  border: none;
  border-radius: var(--icon-btn-radius);
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  cursor: pointer;
  transition: color 0.12s ease, background 0.12s ease;
  flex-shrink: 0;
}

.icon-btn:hover,
.icon-btn:focus-visible {
  color: var(--text);
  background: rgba(255, 255, 255, 0.08);
}

.icon-btn svg {
  display: block;
  width: var(--icon-btn-icon);
  height: var(--icon-btn-icon);
  fill: currentColor;
  flex-shrink: 0;
  pointer-events: none;
}

/* ─── Window Content ─────────────────────────────────────────────────── */
.window-content {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── Finder Shell (two-pane layout) ─────────────────────────────────── */
.finder-shell {
  display: grid;
  grid-template-columns: minmax(160px, 30%) minmax(280px, 1fr);
  grid-auto-rows: minmax(0, 1fr);
  gap: 0;
  height: 100%;
  min-height: 0;
  overflow-x: auto;
}

/* ─── Left Pane (sidebar / nav) ──────────────────────────────────────── */
.pane-sidebar {
  background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 100%);
  border-right: 1px solid var(--border-hairline);
  padding: var(--finder-pane-padding);
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* ─── Right Pane (main content) ──────────────────────────────────────── */
.pane-content {
  background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
  padding: var(--finder-pane-padding);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* ─── Nav List (left pane) ────────────────────────────────────────────── */
.nav-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--list-gap);
}

.nav-item {
  position: relative;
  border-radius: 8px;
}

.nav-link {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: var(--row-gap);
  border-radius: 8px;
  padding: var(--row-padding-block) calc(var(--icon-btn-size) * 2 + 0.375rem) var(--row-padding-block) var(--row-padding-inline);
  min-height: var(--row-min-height);
  color: var(--text);
  text-decoration: none;
  font-size: 0.82rem;
  line-height: 1.2;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 0.82rem;
}

.nav-link:hover,
.nav-link:focus-visible {
  background: rgba(255, 255, 255, 0.1);
  outline: none;
}

.nav-item.is-active .nav-link {
  background: rgba(186, 230, 253, 0.15);
  color: rgba(224, 242, 254, 0.98);
}

.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  color: rgba(125, 211, 252, 0.95);
  line-height: 0;
}

.nav-item.is-active .nav-icon {
  color: rgba(147, 220, 254, 1);
}

.nav-icon svg {
  display: block;
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.nav-label {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Nav row hover actions */
.nav-item-actions {
  position: absolute;
  top: 50%;
  right: 5px;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 120ms ease;
}

.nav-item:hover .nav-item-actions,
.nav-item:focus-within .nav-item-actions {
  opacity: 1;
  pointer-events: auto;
}

/* ─── Content Row List (right pane) ───────────────────────────────────── */
.row-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--list-gap);
  overflow-y: auto;
  flex: 1 1 auto;
  min-height: 0;
}

.content-row {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  padding: var(--row-padding-block) var(--row-padding-inline);
  min-height: var(--row-min-height);
  transition: background 140ms ease;
  cursor: pointer;
  position: relative;
}

.content-row:hover,
.content-row:focus-within {
  background: rgba(255, 255, 255, 0.1);
}

.content-row-left {
  display: flex;
  align-items: center;
  gap: var(--row-gap);
  flex: 1 1 auto;
  min-width: 0;
}

.content-row-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  color: rgba(125, 211, 252, 0.95);
}

.content-row-icon svg {
  display: block;
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.content-row-name {
  font-size: 0.82rem;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.content-row-meta {
  font-size: 0.72rem;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
  margin-right: calc(var(--icon-btn-size) * 2 + 0.25rem);
  transition: opacity 140ms ease;
}

.content-row:hover .content-row-meta {
  opacity: 0;
}

.content-row-right {
  position: absolute;
  right: var(--row-padding-inline);
  top: 50%;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 120ms ease;
}

.content-row:hover .content-row-right,
.content-row:focus-within .content-row-right {
  opacity: 1;
  pointer-events: auto;
}

/* ─── Pane header (section label + action) ────────────────────────────── */
.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  flex-shrink: 0;
}

.pane-section-label {
  margin: 0;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  line-height: 1;
}

/* ─── Scrollbar styling ───────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }
.pane-sidebar:hover::-webkit-scrollbar-thumb,
.row-list:hover::-webkit-scrollbar-thumb { background: rgba(40, 51, 78, 0.98); }

/* ─── Empty state ─────────────────────────────────────────────────────── */
.empty-state {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.78rem;
  opacity: 0.55;
  padding: 1rem;
  text-align: center;
}

/* ─── Demo label ──────────────────────────────────────────────────────── */
.demo-hint {
  position: fixed;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.68rem;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>

<script>
// ── Nav tab switching
document.querySelectorAll('.nav-link').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(li => li.classList.remove('is-active'))
    btn.closest('.nav-item').classList.add('is-active')
  })
})

// ── Prevent action buttons from triggering nav switch or row activation
document.querySelectorAll('.nav-item-actions button, .content-row-right button').forEach(btn => {
  btn.addEventListener('click', e => e.stopPropagation())
})
</script>
