<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar — Nexus</title>
<style>
:root {
  --bg:              #0f0f12;
  --surface:         #1a1a1f;
  --surface-raised:  #232329;
  --surface-hover:   #2a2a31;
  --border:          rgba(255,255,255,0.10);
  --border-hairline: rgba(255,255,255,0.06);
  --text:            hsl(0 0% 89%);
  --text-muted:      hsl(0 0% 50%);
  --text-faint:      hsl(0 0% 32%);
  --accent:          #3b82f6;
  --accent-hover:    #2563eb;
  --today-dot:       #ef4444;
  --radius:          8px;
  --toolbar-h:       52px;
  --day-col-h:       28px;
  --time-col-w:      54px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Toolbar ─────────────────────────────────────────────────────────── */
.toolbar {
  height: var(--toolbar-h);
  min-height: var(--toolbar-h);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 1.1rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  gap: 1rem;
  flex-shrink: 0;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.toolbar-center {
  display: flex;
  align-items: center;
}

.toolbar-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.5rem;
}

.nav-btn {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: none;
  border: none;
  border-radius: 5px;
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.nav-btn:hover { background: var(--surface-hover); color: var(--text); }

.today-btn {
  padding: 0.3rem 0.7rem;
  border-radius: 5px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.76rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.today-btn:hover { background: var(--surface-hover); color: var(--text); }

.header-date {
  font-size: 1.1rem;
  font-weight: 300;
  letter-spacing: -0.01em;
  white-space: nowrap;
  margin-left: 0.4rem;
}
.header-date strong { font-weight: 700; }

.view-toggle {
  display: flex;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 2px;
  gap: 1px;
}
.view-btn {
  padding: 0.22rem 0.75rem;
  border-radius: 5px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 0.76rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  font-family: inherit;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--surface-hover); color: var(--text); }

.search-btn {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none;
  color: var(--text-muted); cursor: pointer; border-radius: 5px;
  transition: background 0.1s, color 0.1s;
}
.search-btn:hover { background: var(--surface-hover); color: var(--text); }

/* ── Main area ───────────────────────────────────────────────────────── */
.cal-body {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ══════════════════════════════════════════════════════════════════════
   MONTH VIEW
═══════════════════════════════════════════════════════════════════════ */
.month-view {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.month-dow-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.month-dow-header span {
  text-align: center;
  padding: 0.45rem 0;
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(6, 1fr);
  flex: 1;
  overflow: hidden;
}

.month-cell {
  border-right: 1px solid var(--border-hairline);
  border-bottom: 1px solid var(--border-hairline);
  padding: 4px 5px 3px;
  overflow: hidden;
  cursor: default;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
}
.month-cell:nth-child(7n) { border-right: none; }
.month-cell:hover { background: rgba(255,255,255,0.02); }

.month-cell-date {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 1px;
}

.date-num {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 0.78rem;
  font-weight: 400;
  line-height: 1;
  flex-shrink: 0;
}
.date-num.other-month { color: var(--text-faint); }
.date-num.today {
  background: var(--today-dot);
  color: #fff;
  font-weight: 600;
}

.month-event-pill {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 0.68rem;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  line-height: 1.6;
  flex-shrink: 0;
}
.month-event-pill:hover { filter: brightness(1.15); }

.more-link {
  font-size: 0.66rem;
  color: var(--text-faint);
  padding: 0 2px;
  cursor: pointer;
}
.more-link:hover { color: var(--text-muted); }

/* ══════════════════════════════════════════════════════════════════════
   WEEK VIEW
═══════════════════════════════════════════════════════════════════════ */
.week-view {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.week-header {
  display: grid;
  grid-template-columns: var(--time-col-w) repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.week-header-spacer { border-right: 1px solid var(--border-hairline); }

.week-day-head {
  text-align: center;
  padding: 0.4rem 0.3rem;
  border-right: 1px solid var(--border-hairline);
  cursor: pointer;
}
.week-day-head:last-child { border-right: none; }
.week-day-head:hover { background: rgba(255,255,255,0.02); }

.week-dow {
  display: block;
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.week-date-num {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 26px; height: 26px;
  border-radius: 50%;
  font-size: 0.88rem;
  font-weight: 400;
}
.week-date-num.today {
  background: var(--today-dot);
  color: #fff;
  font-weight: 600;
}

/* All-day row */
.week-allday-row {
  display: grid;
  grid-template-columns: var(--time-col-w) repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  min-height: 28px;
  flex-shrink: 0;
}
.week-allday-label {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
  font-size: 0.62rem;
  color: var(--text-faint);
  border-right: 1px solid var(--border-hairline);
}
.week-allday-cell {
  border-right: 1px solid var(--border-hairline);
  padding: 3px 3px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.week-allday-cell:last-child { border-right: none; }

.allday-pill {
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 0.68rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  line-height: 1.6;
}
.allday-pill:hover { filter: brightness(1.15); }

/* Time grid */
.week-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.week-scroll::-webkit-scrollbar { width: 5px; }
.week-scroll::-webkit-scrollbar-track { background: transparent; }
.week-scroll::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 4px; }

.week-time-grid {
  display: grid;
  grid-template-columns: var(--time-col-w) repeat(7, 1fr);
  position: relative;
}

.time-label-col {
  display: flex;
  flex-direction: column;
}
.time-label {
  height: 48px;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  padding-right: 8px;
  padding-top: 2px;
  font-size: 0.62rem;
  color: var(--text-faint);
  border-right: 1px solid var(--border-hairline);
  flex-shrink: 0;
}

.week-day-col {
  position: relative;
  border-right: 1px solid var(--border-hairline);
}
.week-day-col:last-child { border-right: none; }

.hour-line {
  position: absolute;
  left: 0; right: 0;
  border-top: 1px solid var(--border-hairline);
}

.week-event-block {
  position: absolute;
  left: 2px; right: 2px;
  border-radius: 4px;
  padding: 2px 5px;
  font-size: 0.68rem;
  overflow: hidden;
  cursor: pointer;
  line-height: 1.4;
  z-index: 1;
}
.week-event-block:hover { filter: brightness(1.15); z-index: 2; }
.week-event-block .ev-title { font-weight: 500; }
.week-event-block .ev-time { opacity: 0.75; font-size: 0.63rem; }

.now-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: var(--today-dot);
  z-index: 3;
  pointer-events: none;
}
.now-line::before {
  content: '';
  position: absolute;
  left: -4px; top: -4px;
  width: 10px; height: 10px;
  background: var(--today-dot);
  border-radius: 50%;
}

/* ══════════════════════════════════════════════════════════════════════
   DAY VIEW
═══════════════════════════════════════════════════════════════════════ */
.day-view {
  display: flex;
  height: 100%;
  overflow: hidden;
}

.day-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
}

.day-header {
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.day-header-title {
  font-size: 1.4rem;
  font-weight: 700;
  line-height: 1.1;
}
.day-header-subtitle {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 1px;
}

.day-allday-row {
  border-bottom: 1px solid var(--border);
  padding: 4px 0 4px var(--time-col-w);
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
  min-height: 30px;
}

.day-scroll {
  flex: 1;
  overflow-y: auto;
}
.day-scroll::-webkit-scrollbar { width: 5px; }
.day-scroll::-webkit-scrollbar-track { background: transparent; }
.day-scroll::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 4px; }

.day-time-grid {
  display: grid;
  grid-template-columns: var(--time-col-w) 1fr;
  position: relative;
}

.day-day-col {
  position: relative;
  border-left: 1px solid var(--border-hairline);
}

/* Sidebar (mini calendar + details) */
.day-sidebar {
  width: 220px;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  padding: 1rem 0.85rem;
  gap: 1rem;
  overflow-y: auto;
}
.day-sidebar::-webkit-scrollbar { width: 4px; }
.day-sidebar::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 4px; }

/* Mini calendar */
.mini-cal {}
.mini-cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}
.mini-cal-title {
  font-size: 0.78rem;
  font-weight: 600;
}
.mini-nav {
  display: flex; gap: 2px;
}
.mini-nav-btn {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; border-radius: 4px;
  color: var(--text-muted); cursor: pointer;
  transition: background 0.1s;
}
.mini-nav-btn:hover { background: var(--surface-hover); color: var(--text); }

.mini-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
}
.mini-dow {
  text-align: center;
  font-size: 0.6rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  padding: 2px 0;
}
.mini-date {
  text-align: center;
  padding: 2px 0;
  font-size: 0.72rem;
  border-radius: 50%;
  width: 22px; height: 22px;
  margin: 1px auto;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.mini-date:hover { background: var(--surface-hover); }
.mini-date.other-month { color: var(--text-faint); }
.mini-date.today { background: var(--today-dot); color: #fff; font-weight: 600; }
.mini-date.selected { background: var(--accent); color: #fff; font-weight: 600; }
.mini-date.has-event { position: relative; }
.mini-date.has-event::after {
  content: '';
  position: absolute;
  bottom: 1px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
}
.mini-date.today.has-event::after,
.mini-date.selected.has-event::after { background: rgba(255,255,255,0.7); }

.no-event-msg {
  font-size: 0.75rem;
  color: var(--text-faint);
  text-align: center;
  margin-top: 1rem;
}

/* Event detail card */
.event-detail-card {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.75rem;
  display: none;
}
.event-detail-card.visible { display: block; }
.event-detail-color {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
}
.event-detail-title { font-weight: 600; font-size: 0.82rem; }
.event-detail-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }

/* ── Event creation popover ──────────────────────────────────────────── */
.popover-overlay {
  position: fixed; inset: 0;
  z-index: 100;
  display: none;
}
.popover-overlay.visible { display: block; }

.popover {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  width: 280px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 101;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}
.popover-title { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
.popover input[type="text"] {
  width: 100%;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0.38rem 0.55rem;
  color: var(--text);
  font-size: 0.82rem;
  font-family: inherit;
  outline: none;
}
.popover input[type="text"]:focus { border-color: var(--accent); }
.popover-row { display: flex; gap: 0.5rem; align-items: center; }
.popover-row label { font-size: 0.72rem; color: var(--text-muted); width: 42px; flex-shrink: 0; }
.popover-row input[type="time"],
.popover-row input[type="date"],
.popover-row input[type="checkbox"] {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0.3rem 0.5rem;
  color: var(--text);
  font-size: 0.76rem;
  font-family: inherit;
  outline: none;
  flex: 1;
}
.popover-row input[type="time"]:focus,
.popover-row input[type="date"]:focus { border-color: var(--accent); }
.popover-row input[type="checkbox"] { flex: 0; width: 14px; height: 14px; }
.color-row { display: flex; gap: 5px; flex-wrap: wrap; }
.ev-color-opt {
  width: 18px; height: 18px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.1s, transform 0.1s;
}
.ev-color-opt:hover { transform: scale(1.15); }
.ev-color-opt.selected { border-color: var(--text); }
.popover-actions { display: flex; gap: 0.4rem; justify-content: flex-end; margin-top: 0.2rem; }
.btn-sm {
  padding: 0.28rem 0.65rem;
  border-radius: 5px;
  font-size: 0.74rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: background 0.1s;
}
.btn-cancel { background: var(--surface-raised); color: var(--text-muted); border: 1px solid var(--border); }
.btn-cancel:hover { color: var(--text); }
.btn-add { background: var(--accent); color: #fff; }
.btn-add:hover { background: var(--accent-hover); }

/* ── Hidden ──────────────────────────────────────────────────────────── */
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-left">
    <button class="nav-btn" id="btn-prev" title="Previous">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-btn" id="btn-next" title="Next">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="today-btn" id="btn-today">Today</button>
    <span class="header-date" id="header-date"></span>
  </div>
  <div class="toolbar-center">
    <div class="view-toggle">
      <button class="view-btn" data-view="day">Day</button>
      <button class="view-btn active" data-view="week">Week</button>
      <button class="view-btn" data-view="month">Month</button>
      <button class="view-btn" data-view="year">Year</button>
    </div>
  </div>
  <div class="toolbar-right">
    <button class="search-btn" title="Search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="6.5" cy="6.5" r="4"/><line x1="10" y1="10" x2="14" y2="14"/>
      </svg>
    </button>
  </div>
</div>

<!-- CALENDAR BODY -->
<div class="cal-body" id="cal-body"></div>

<!-- NEW EVENT POPOVER -->
<div class="popover-overlay" id="popover-overlay">
  <div class="popover" id="popover">
    <div class="popover-title">New Event</div>
    <input type="text" id="ev-title-input" placeholder="Event title" />
    <div class="popover-row">
      <label>Date</label>
      <input type="date" id="ev-date-input" />
    </div>
    <div class="popover-row" id="allday-time-row">
      <label>All day</label>
      <input type="checkbox" id="ev-allday" />
    </div>
    <div class="popover-row" id="ev-start-row">
      <label>Start</label>
      <input type="time" id="ev-start" value="09:00" />
    </div>
    <div class="popover-row" id="ev-end-row">
      <label>End</label>
      <input type="time" id="ev-end" value="10:00" />
    </div>
    <div class="popover-row">
      <label>Color</label>
      <div class="color-row" id="ev-color-picker"></div>
    </div>
    <div class="popover-actions">
      <button class="btn-sm btn-cancel" id="popover-cancel">Cancel</button>
      <button class="btn-sm btn-add" id="popover-save">Add</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const EV_COLORS = ['#3b82f6','#a855f7','#22c55e','#ef4444','#f59e0b','#ec4899','#06b6d4','#84cc16'];

const today = new Date();
today.setHours(0,0,0,0);

let state = {
  view: 'week',
  cursor: new Date(today),
  events: loadEvents(),
  miniCursor: new Date(today),
  selectedEvent: null,
};

let newEvColor = EV_COLORS[0];
let popoverTarget = null;

function loadEvents() {
  const saved = localStorage.getItem('nx_cal_events');
  if (saved) {
    const arr = JSON.parse(saved);
    return arr.map(e => ({...e, start: new Date(e.start), end: new Date(e.end)}));
  }
  // Seed demo events
  const seed = [];
  const y = today.getFullYear(), m = today.getMonth();
  function ev(title, color, startH, endH, dayOffset, allDay=false) {
    const s = new Date(y, m, today.getDate() + dayOffset);
    const e = new Date(y, m, today.getDate() + dayOffset);
    if (!allDay) { s.setHours(startH,0,0,0); e.setHours(endH,0,0,0); }
    return { id: Math.random().toString(36).slice(2), title, color, start: s, end: e, allDay };
  }
  seed.push(ev('Team standup',   '#3b82f6',  9, 10,  1));
  seed.push(ev('Lunch',          '#22c55e', 12, 13,  1));
  seed.push(ev('Design review',  '#a855f7', 14, 15,  2));
  seed.push(ev('Deploy v2',      '#ef4444', 10, 11,  3));
  seed.push(ev('1:1 with Alex',  '#06b6d4', 15, 16,  4));
  seed.push(ev('Sprint planning','#f59e0b',  9, 11,  7));
  seed.push(ev('Nexus update',   '#3b82f6', 11, 12,  0));
  seed.push(ev('Doctor appt',    '#ec4899', 14, 15, -2));
  seed.push(ev('Gym',            '#84cc16',  7,  8, -1));
  seed.push(ev('Birthday 🎂',    '#ef4444',  0,  0,  5, true));

}

function saveEvents() {
  localStorage.setItem('nx_cal_events', JSON.stringify(
    state.events.map(e => ({...e, start: e.start.toISOString(), end: e.end.toISOString()}))
  ));
}

function ds(d) { return d.toISOString().split('T')[0]; }
function sameDay(a,b) { return ds(a) === ds(b); }

// ══════════════════════════════════════════════════════
// HEADER DATE LABEL
// ══════════════════════════════════════════════════════
function updateHeaderDate() {
  const el = document.getElementById('header-date');
  const c = state.cursor;
  if (state.view === 'month') {
    el.innerHTML = `<strong>${MONTHS[c.getMonth()]}</strong> ${c.getFullYear()}`;
  } else if (state.view === 'week') {
    const sun = weekStart(c);
    const sat = new Date(sun); sat.setDate(sat.getDate() + 6);
    if (sun.getMonth() === sat.getMonth()) {
      el.innerHTML = `<strong>${MONTHS[sun.getMonth()]}</strong> ${sun.getFullYear()}`;
    } else {
      el.innerHTML = `<strong>${MONTHS[sun.getMonth()]}</strong> – <strong>${MONTHS[sat.getMonth()]}</strong> ${sat.getFullYear()}`;
    }
  } else if (state.view === 'year') {
    el.innerHTML = `<strong>${c.getFullYear()}</strong>`;
  } else {
    el.innerHTML = `<strong>${MONTHS[c.getMonth()]}</strong> ${c.getDate()}, ${c.getFullYear()}`;
  }
}

// ══════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════
document.getElementById('btn-prev').onclick = () => navigate(-1);
document.getElementById('btn-next').onclick = () => navigate(1);
document.getElementById('btn-today').onclick = () => {
  state.cursor = new Date(today);
  state.miniCursor = new Date(today);
  render();
};

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.onclick = () => {
    state.view = btn.dataset.view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
});

function navigate(dir) {
  const c = state.cursor;
  if (state.view === 'month') {
    state.cursor = new Date(c.getFullYear(), c.getMonth() + dir, 1);
  } else if (state.view === 'week') {
    state.cursor = new Date(c.getFullYear(), c.getMonth(), c.getDate() + dir * 7);
  } else if (state.view === 'year') {
    state.cursor = new Date(c.getFullYear() + dir, c.getMonth(), 1);
  } else {
    state.cursor = new Date(c.getFullYear(), c.getMonth(), c.getDate() + dir);
  }
  render();
}

function weekStart(d) {
  const s = new Date(d);
  s.setDate(s.getDate() - s.getDay());
  s.setHours(0,0,0,0);
  return s;
}

// ══════════════════════════════════════════════════════
// RENDER DISPATCH
// ══════════════════════════════════════════════════════
function render() {
  updateHeaderDate();
  const body = document.getElementById('cal-body');
  if (state.view === 'month')      renderMonth(body);
  else if (state.view === 'week')  renderWeek(body);
  else if (state.view === 'year')  renderYear(body);
  else                             renderDay(body);
}

// ══════════════════════════════════════════════════════
// YEAR VIEW
// ══════════════════════════════════════════════════════
function renderYear(body) {
  const y = state.cursor.getFullYear();
  body.innerHTML = '';

  const view = document.createElement('div');
  view.style.cssText = 'height:100%;display:flex;flex-direction:column;padding:1.5rem 1.75rem;overflow:hidden;';
  view.classList.add('year-scroll');

  // Add scrollbar style
  const style = document.createElement('style');
  style.textContent = `.year-scroll::-webkit-scrollbar{width:5px}.year-scroll::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:4px}`;
  document.head.appendChild(style);

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.5rem 1.75rem;flex:1;min-height:0;';

  for (let m = 0; m < 12; m++) {
    const card = document.createElement('div');
    card.style.cssText = 'cursor:pointer;';

    // Month title
    const title = document.createElement('div');
    title.style.cssText = 'font-size:0.82rem;font-weight:600;margin-bottom:0.5rem;color:var(--text);';
    title.textContent = MONTHS[m];
    card.appendChild(title);

    // Mini grid
    const miniGrid = document.createElement('div');
    miniGrid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:0;';

    // DOW headers
    DAYS.forEach(d => {
      const dow = document.createElement('div');
      dow.style.cssText = 'text-align:center;font-size:0.55rem;font-weight:500;letter-spacing:0.04em;color:var(--text-faint);padding:2px 0;';
      dow.textContent = d[0];
      miniGrid.appendChild(dow);
    });

    // Build cells
    const firstDay = new Date(y, m, 1).getDay();
    const dIM = new Date(y, m+1, 0).getDate();
    const dIP = new Date(y, m, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push({ date: new Date(y, m-1, dIP-firstDay+1+i), cur: false });
    for (let i = 1; i <= dIM; i++) cells.push({ date: new Date(y, m, i), cur: true });
    while (cells.length % 7 !== 0) cells.push({ date: new Date(y, m+1, cells.length-firstDay-dIM+1), cur: false });

    cells.forEach(({ date, cur }) => {
      const hasEv = state.events.some(e => sameDay(e.start, date));
      const isToday = sameDay(date, today);
      const d = document.createElement('div');
      d.style.cssText = `text-align:center;font-size:0.62rem;width:18px;height:18px;margin:1px auto;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:background 0.1s;${!cur ? 'color:var(--text-faint);' : ''}${isToday ? 'background:var(--today-dot);color:#fff;font-weight:600;' : ''}`;
      d.textContent = date.getDate();
      if (hasEv && !isToday) {
        d.style.position = 'relative';
        const dot = document.createElement('span');
        dot.style.cssText = `position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent);pointer-events:none;`;
        d.appendChild(dot);
      }
      if (!isToday) {
        d.onmouseenter = () => { d.style.background = 'var(--surface-hover)'; };
        d.onmouseleave = () => { d.style.background = ''; };
      }
      d.onclick = (e) => {
        e.stopPropagation();
        state.cursor = new Date(date);
        state.view = 'day';
        document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'day'));
        render();
      };
      miniGrid.appendChild(d);
    });

    card.appendChild(miniGrid);

    // Click month title → go to month view
    title.onclick = (e) => {
      e.stopPropagation();
      state.cursor = new Date(y, m, 1);
      state.view = 'month';
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'month'));
      render();
    };
    title.style.cursor = 'pointer';
    title.onmouseenter = () => { title.style.color = 'var(--accent)'; };
    title.onmouseleave = () => { title.style.color = 'var(--text)'; };

    grid.appendChild(card);
  }

  view.appendChild(grid);
  body.appendChild(view);
}

// ══════════════════════════════════════════════════════
// MONTH VIEW
// ══════════════════════════════════════════════════════
function renderMonth(body) {
  const c = state.cursor;
  const y = c.getFullYear(), m = c.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev  = new Date(y, m, 0).getDate();

  // Build 42 cells
  const cells = [];
  for (let i = 0; i < firstDay; i++) {
    cells.push({ date: new Date(y, m-1, daysInPrev - firstDay + 1 + i), cur: false });
  }
  for (let i = 1; i <= daysInMonth; i++) {
    cells.push({ date: new Date(y, m, i), cur: true });
  }
  while (cells.length < 42) {
    cells.push({ date: new Date(y, m+1, cells.length - firstDay - daysInMonth + 1), cur: false });
  }

  body.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'month-view';

  // DOW header
  const dowHdr = document.createElement('div');
  dowHdr.className = 'month-dow-header';
  DAYS.forEach(d => {
    const s = document.createElement('span');
    s.textContent = d;
    dowHdr.appendChild(s);
  });
  view.appendChild(dowHdr);

  // Grid
  const grid = document.createElement('div');
  grid.className = 'month-grid';

  cells.forEach(({ date, cur }) => {
    const cell = document.createElement('div');
    cell.className = 'month-cell';
    cell.onclick = (e) => {
      if (e.target === cell || e.target.classList.contains('date-num')) openPopover(date, e);
    };

    const dateRow = document.createElement('div');
    dateRow.className = 'month-cell-date';
    const num = document.createElement('div');
    num.className = 'date-num' + (!cur ? ' other-month' : '') + (sameDay(date, today) ? ' today' : '');
    num.textContent = date.getDate();
    dateRow.appendChild(num);
    cell.appendChild(dateRow);

    // Events for this day
    const dayEvs = state.events
      .filter(e => sameDay(e.start, date) || (e.allDay && e.start <= date && e.end >= date))
      .sort((a,b) => a.start - b.start);

    const maxShow = 3;
    dayEvs.slice(0, maxShow).forEach(ev => {
      const pill = document.createElement('div');
      pill.className = 'month-event-pill';
      pill.style.background = ev.color + '2a';
      pill.style.color = ev.color;
      const dot = `<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${ev.color};flex-shrink:0"></span>`;
      const timeStr = ev.allDay ? '' : formatTime(ev.start);
      pill.innerHTML = `${dot} ${timeStr ? `<span style="opacity:.7;margin-right:2px">${timeStr}</span>` : ''}${ev.title}`;
      pill.onclick = (e) => { e.stopPropagation(); selectEvent(ev); };
      cell.appendChild(pill);
    });

    if (dayEvs.length > maxShow) {
      const more = document.createElement('div');
      more.className = 'more-link';
      more.textContent = `+${dayEvs.length - maxShow} more`;
      cell.appendChild(more);
    }

    grid.appendChild(cell);
  });

  view.appendChild(grid);
  body.appendChild(view);
}

// ══════════════════════════════════════════════════════
// WEEK VIEW
// ══════════════════════════════════════════════════════
function renderWeek(body) {
  const sun = weekStart(state.cursor);
  const weekDays = Array.from({length:7}, (_,i) => { const d = new Date(sun); d.setDate(d.getDate()+i); return d; });
  const HOUR_H = 48;

  body.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'week-view';

  // Header row
  const hdr = document.createElement('div');
  hdr.className = 'week-header';
  hdr.appendChild(el('div','week-header-spacer'));
  weekDays.forEach(d => {
    const col = el('div','week-day-head');
    col.onclick = () => { state.cursor = new Date(d); state.view = 'day'; document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view==='day')); render(); };
    const dow = el('span','week-dow'); dow.textContent = DAYS[d.getDay()];
    const num = el('span','week-date-num' + (sameDay(d,today)?' today':'')); num.textContent = d.getDate();
    col.append(dow, num);
    hdr.appendChild(col);
  });
  view.appendChild(hdr);

  // All-day row
  const allDayRow = el('div','week-allday-row');
  const adLabel = el('div','week-allday-label'); adLabel.textContent = 'all-day';
  allDayRow.appendChild(adLabel);
  weekDays.forEach(d => {
    const cell = el('div','week-allday-cell');
    state.events.filter(e => e.allDay && sameDay(e.start, d)).forEach(ev => {
      const pill = el('div','allday-pill');
      pill.style.background = ev.color + '33';
      pill.style.color = ev.color;
      pill.textContent = ev.title;
      pill.onclick = () => selectEvent(ev);
      cell.appendChild(pill);
    });
    allDayRow.appendChild(cell);
  });
  view.appendChild(allDayRow);

  // Scrollable time grid
  const scroll = el('div','week-scroll');
  const grid = el('div','week-time-grid');

  // Time labels
  const labelCol = el('div','time-label-col');
  for (let h = 0; h < 24; h++) {
    const lbl = el('div','time-label');
    lbl.textContent = h === 0 ? '' : formatHour(h);
    lbl.style.height = HOUR_H + 'px';
    labelCol.appendChild(lbl);
  }
  grid.appendChild(labelCol);

  // Day columns
  weekDays.forEach(d => {
    const col = el('div','week-day-col');
    col.style.height = HOUR_H * 24 + 'px';
    col.onclick = (e) => {
      if (e.target === col) {
        const y = e.offsetY;
        const h = Math.floor(y / HOUR_H);
        const clickDate = new Date(d);
        clickDate.setHours(h, 0, 0, 0);
        openPopover(clickDate, e, h);
      }
    };

    // Hour lines
    for (let h = 0; h < 24; h++) {
      const line = el('div','hour-line');
      line.style.top = h * HOUR_H + 'px';
      col.appendChild(line);
    }

    // Today now-line
    if (sameDay(d, today)) {
      const now = new Date();
      const pct = (now.getHours() * 60 + now.getMinutes()) / (24*60);
      const line = el('div','now-line');
      line.style.top = pct * HOUR_H * 24 + 'px';
      col.appendChild(line);
    }

    // Timed events
    state.events.filter(e => !e.allDay && sameDay(e.start, d)).forEach(ev => {
      const startMin = ev.start.getHours()*60 + ev.start.getMinutes();
      const endMin   = ev.end.getHours()*60   + ev.end.getMinutes();
      const dur = Math.max(endMin - startMin, 30);
      const block = el('div','week-event-block');
      block.style.top    = (startMin / 60) * HOUR_H + 'px';
      block.style.height = (dur / 60) * HOUR_H + 'px';
      block.style.background = ev.color + '33';
      block.style.borderLeft = `3px solid ${ev.color}`;
      block.style.color = ev.color;
      const t = el('div','ev-title'); t.textContent = ev.title;
      const tm = el('div','ev-time'); tm.textContent = formatTime(ev.start) + ' – ' + formatTime(ev.end);
      block.append(t, tm);
      block.onclick = (e) => { e.stopPropagation(); selectEvent(ev); };
      col.appendChild(block);
    });

    grid.appendChild(col);
  });

  scroll.appendChild(grid);
  view.appendChild(scroll);
  body.appendChild(view);

  // Scroll to 8am
  requestAnimationFrame(() => { scroll.scrollTop = 8 * HOUR_H - 20; });
}

// ══════════════════════════════════════════════════════
// DAY VIEW
// ══════════════════════════════════════════════════════
function renderDay(body) {
  const d = state.cursor;
  const HOUR_H = 50;

  body.innerHTML = '';
  const view = el('div','day-view');

  // Main pane
  const main = el('div','day-main');

  const hdr = el('div','day-header');
  const title = el('div','day-header-title');
  title.textContent = d.getDate();
  const subtitle = el('div','day-header-subtitle');
  subtitle.textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  hdr.append(title, subtitle);
  main.appendChild(hdr);

  // All-day
  const allDayRow = el('div','day-allday-row');
  state.events.filter(e => e.allDay && sameDay(e.start, d)).forEach(ev => {
    const pill = el('div','allday-pill');
    pill.style.background = ev.color + '33';
    pill.style.color = ev.color;
    pill.style.marginLeft = '0';
    pill.style.maxWidth = '200px';
    pill.textContent = ev.title;
    pill.onclick = () => selectEvent(ev);
    allDayRow.appendChild(pill);
  });
  main.appendChild(allDayRow);

  // Scroll + time grid
  const scroll = el('div','day-scroll');
  const grid = el('div','day-time-grid');

  const labelCol = el('div','time-label-col');
  for (let h = 0; h < 24; h++) {
    const lbl = el('div','time-label');
    lbl.textContent = h === 0 ? '' : formatHour(h);
    lbl.style.height = HOUR_H + 'px';
    labelCol.appendChild(lbl);
  }
  grid.appendChild(labelCol);

  const dayCol = el('div','day-day-col');
  dayCol.style.height = HOUR_H * 24 + 'px';
  dayCol.onclick = (e) => {
    if (e.target === dayCol) {
      const h = Math.floor(e.offsetY / HOUR_H);
      const cd = new Date(d); cd.setHours(h,0,0,0);
      openPopover(cd, e, h);
    }
  };

  for (let h = 0; h < 24; h++) {
    const line = el('div','hour-line');
    line.style.top = h * HOUR_H + 'px';
    dayCol.appendChild(line);
  }

  if (sameDay(d, today)) {
    const now = new Date();
    const pct = (now.getHours()*60 + now.getMinutes()) / (24*60);
    const nl = el('div','now-line');
    nl.style.top = pct * HOUR_H * 24 + 'px';
    dayCol.appendChild(nl);
  }

  state.events.filter(e => !e.allDay && sameDay(e.start, d)).forEach(ev => {
    const startMin = ev.start.getHours()*60 + ev.start.getMinutes();
    const endMin   = ev.end.getHours()*60   + ev.end.getMinutes();
    const dur = Math.max(endMin - startMin, 30);
    const block = el('div','week-event-block');
    block.style.top    = (startMin/60)*HOUR_H + 'px';
    block.style.height = (dur/60)*HOUR_H + 'px';
    block.style.background = ev.color + '33';
    block.style.borderLeft = `3px solid ${ev.color}`;
    block.style.color = ev.color;
    const t = el('div','ev-title'); t.textContent = ev.title;
    const tm = el('div','ev-time'); tm.textContent = formatTime(ev.start) + ' – ' + formatTime(ev.end);
    block.append(t, tm);
    block.onclick = (e) => { e.stopPropagation(); selectEvent(ev); };
    dayCol.appendChild(block);
  });

  grid.appendChild(dayCol);
  scroll.appendChild(grid);
  main.appendChild(scroll);
  view.appendChild(main);

  // Sidebar
  const sidebar = el('div','day-sidebar');

  // Mini calendar
  const miniCal = renderMiniCal();
  sidebar.appendChild(miniCal);

  // Event detail or placeholder
  const detailCard = el('div','event-detail-card');
  detailCard.id = 'event-detail-card';
  if (state.selectedEvent) {
    populateDetailCard(detailCard, state.selectedEvent);
    detailCard.classList.add('visible');
  } else {
    const msg = el('div','no-event-msg');
    msg.textContent = 'No Event Selected';
    sidebar.appendChild(msg);
  }
  sidebar.appendChild(detailCard);

  view.appendChild(sidebar);
  body.appendChild(view);

  requestAnimationFrame(() => { scroll.scrollTop = 8 * HOUR_H - 20; });
}

function renderMiniCal() {
  const mc = state.miniCursor;
  const y = mc.getFullYear(), m = mc.getMonth();
  const firstDay = new Date(y,m,1).getDay();
  const dIM = new Date(y,m+1,0).getDate();
  const dIP = new Date(y,m,0).getDate();

  const wrap = el('div','mini-cal');

  const hdr = el('div','mini-cal-header');
  const title = el('div','mini-cal-title');
  title.textContent = MONTHS[m].slice(0,3) + ' ' + y;
  const nav = el('div','mini-nav');
  const pb = el('button','mini-nav-btn');
  pb.innerHTML = '‹';
  pb.onclick = () => { state.miniCursor = new Date(y, m-1, 1); render(); };
  const nb = el('button','mini-nav-btn');
  nb.innerHTML = '›';
  nb.onclick = () => { state.miniCursor = new Date(y, m+1, 1); render(); };
  nav.append(pb, nb);
  hdr.append(title, nav);
  wrap.appendChild(hdr);

  const grid = el('div','mini-cal-grid');
  DAYS.forEach(d => { const s = el('div','mini-dow'); s.textContent = d[0]; grid.appendChild(s); });

  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push({date: new Date(y,m-1,dIP-firstDay+1+i), cur:false});
  for (let i = 1; i <= dIM; i++) cells.push({date: new Date(y,m,i), cur:true});
  while (cells.length < 42) cells.push({date: new Date(y,m+1,cells.length-firstDay-dIM+1), cur:false});

  cells.forEach(({date,cur}) => {
    const hasEv = state.events.some(e => sameDay(e.start, date));
    const isToday = sameDay(date, today);
    const isSel = sameDay(date, state.cursor);
    let cls = 'mini-date';
    if (!cur) cls += ' other-month';
    if (isToday) cls += ' today';
    else if (isSel) cls += ' selected';
    if (hasEv) cls += ' has-event';
    const d = el('div', cls);
    d.textContent = date.getDate();
    d.onclick = () => {
      state.cursor = new Date(date);
      if (state.view !== 'day') { state.view = 'day'; document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view==='day')); }
      render();
    };
    grid.appendChild(d);
  });

  wrap.appendChild(grid);
  return wrap;
}

function populateDetailCard(card, ev) {
  card.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <span class="event-detail-color" style="background:${ev.color}"></span>
      <span class="event-detail-title">${ev.title}</span>
    </div>
    <div class="event-detail-time">${ev.allDay ? 'All day' : formatTime(ev.start) + ' – ' + formatTime(ev.end)}</div>
    <div class="event-detail-time" style="margin-top:2px">${DAYS[ev.start.getDay()]}, ${MONTHS[ev.start.getMonth()]} ${ev.start.getDate()}</div>
    <button onclick="deleteEvent('${ev.id}')" style="margin-top:8px;padding:3px 8px;border-radius:4px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);color:#ef4444;font-size:0.7rem;cursor:pointer;font-family:inherit">Delete</button>
  `;
}

function selectEvent(ev) {
  state.selectedEvent = ev;
  if (state.view === 'day') {
    const card = document.getElementById('event-detail-card');
    if (card) { populateDetailCard(card, ev); card.classList.add('visible'); }
  }
}

function deleteEvent(id) {
  state.events = state.events.filter(e => e.id !== id);
  state.selectedEvent = null;
  saveEvents();
  render();
}

// ══════════════════════════════════════════════════════
// NEW EVENT POPOVER
// ══════════════════════════════════════════════════════
function buildColorPicker() {
  const el2 = document.getElementById('ev-color-picker');
  el2.innerHTML = '';
  EV_COLORS.forEach(c => {
    const b = el('div', 'ev-color-opt' + (c === newEvColor ? ' selected' : ''));
    b.style.background = c;
    b.onclick = () => { newEvColor = c; document.querySelectorAll('.ev-color-opt').forEach(x => x.classList.toggle('selected', x.style.background===c||x.style.backgroundColor===c)); };
    el2.appendChild(b);
  });
}

function openPopover(date, event, suggestedHour) {
  popoverTarget = date;
  const dateStr = ds(date);
  document.getElementById('ev-date-input').value = dateStr;
  document.getElementById('ev-title-input').value = '';
  const h = suggestedHour ?? 9;
  document.getElementById('ev-start').value = `${String(h).padStart(2,'0')}:00`;
  document.getElementById('ev-end').value   = `${String(Math.min(h+1,23)).padStart(2,'0')}:00`;
  document.getElementById('ev-allday').checked = false;
  document.getElementById('ev-start-row').style.display = '';
  document.getElementById('ev-end-row').style.display = '';
  buildColorPicker();

  const pop = document.getElementById('popover');
  const overlay = document.getElementById('popover-overlay');
  overlay.classList.add('visible');

  // Position near click
  const x = Math.min(event.clientX + 10, window.innerWidth - 300);
  const y = Math.min(event.clientY + 10, window.innerHeight - 350);
  pop.style.left = x + 'px';
  pop.style.top  = y + 'px';

  requestAnimationFrame(() => document.getElementById('ev-title-input').focus());
}

document.getElementById('ev-allday').onchange = function() {
  document.getElementById('ev-start-row').style.display = this.checked ? 'none' : '';
  document.getElementById('ev-end-row').style.display   = this.checked ? 'none' : '';
};

document.getElementById('popover-cancel').onclick = closePopover;
document.getElementById('popover-overlay').onclick = (e) => { if (e.target === e.currentTarget) closePopover(); };

document.getElementById('popover-save').onclick = () => {
  const title = document.getElementById('ev-title-input').value.trim();
  if (!title) { document.getElementById('ev-title-input').focus(); return; }

  const dateVal = document.getElementById('ev-date-input').value;
  const allDay  = document.getElementById('ev-allday').checked;
  const [y,m,d] = dateVal.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const end   = new Date(y, m-1, d);

  if (!allDay) {
    const [sh,sm] = document.getElementById('ev-start').value.split(':').map(Number);
    const [eh,em] = document.getElementById('ev-end').value.split(':').map(Number);
    start.setHours(sh, sm, 0, 0);
    end.setHours(eh, em, 0, 0);
  }

  state.events.push({ id: Math.random().toString(36).slice(2), title, color: newEvColor, start, end, allDay });
  saveEvents();
  closePopover();
  render();
};

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopover(); });
document.getElementById('ev-title-input').onkeydown = e => { if (e.key === 'Enter') document.getElementById('popover-save').click(); };

function closePopover() {
  document.getElementById('popover-overlay').classList.remove('visible');
}

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function el(tag, cls) {
  const e = document.createElement(tag === 'div' ? 'div' : tag);
  if (cls) e.className = cls;
  return e;
}

function formatTime(d) {
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return m === 0 ? `${h12} ${ampm}` : `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function formatHour(h) {
  return h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h-12} PM`;
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
render();
</script>
</body>
</html>
