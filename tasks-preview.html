<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks — Nexus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@18,400,0,0&display=block" />
<style>
:root {
  --bg:              #0f0f12;
  --surface:         #1a1a1f;
  --surface-raised:  #232329;
  --surface-hover:   #2a2a31;
  --border:          rgba(255,255,255,0.10);
  --border-hairline: rgba(255,255,255,0.06);
  --text:            hsl(0 0% 89%);
  --text-muted:      hsl(0 0% 50%);
  --text-faint:      hsl(0 0% 32%);
  --accent:          #3b82f6;
  --success:         #22c55e;
  --font-size:       0.88rem;

  /* OS standards */
  --os-window-padding:        0.75rem;
  --os-header-min-height:     1.28rem;
  --os-header-gap:            0.3rem;
  --os-title-size:            0.88rem;
  --os-title-letter-spacing:  0.02em;
  --os-subtitle-size:         0.72rem;
  --os-grid-row-gap:          0.34rem;
  --os-grid-col-gap:          0.55rem;
  --os-card-radius:           8px;
  --nexus-icon-btn-size:      1.25rem;
  --nexus-icon-btn-radius:    calc(0.375rem * 1.25 / 1.75);
  --nexus-icon-btn-icon:      0.9375rem;
  --nexus-small-action-gap:   0.2rem;

  --nexus-row-padding-block:   7px;
  --nexus-row-padding-inline:  9px;
  --nexus-row-gap:             9px;
  --nexus-list-leading-size:   18px;
  --task-text-control-height:  23.5px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: var(--font-size);
  line-height: 1.5;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ── Material icon helper ── */
.material-icon {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: inherit;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}
.material-icon--xs { font-size: 0.9375rem; width: 0.9375rem; height: 0.9375rem; }

/* ── Sidebar (list picker) ── */
.sidebar {
  width: 200px;
  min-width: 200px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 0.85rem 0.85rem 0.5rem;
  border-bottom: 1px solid var(--border-hairline);
}

.sidebar-header h1 {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.sidebar-lists {
  flex: 1;
  overflow-y: auto;
  padding: 0.4rem 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.sidebar-lists::-webkit-scrollbar { width: 4px; }
.sidebar-lists::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 4px; }

.sidebar-list-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.38rem 0.5rem;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 0.8rem;
  transition: background 0.1s, color 0.1s;
  user-select: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.sidebar-list-item:hover { background: var(--surface-hover); color: var(--text); }
.sidebar-list-item.active { background: rgba(59,130,246,0.12); color: var(--accent); }

.sidebar-list-item .list-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-faint);
  flex-shrink: 0;
}
.sidebar-list-item.active .list-dot { background: var(--accent); }

.sidebar-add {
  padding: 0.5rem 0.6rem;
  border-top: 1px solid var(--border-hairline);
}

.sidebar-add-btn {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  width: 100%;
  padding: 0.38rem 0.5rem;
  border-radius: 6px;
  border: 1px dashed var(--border);
  background: none;
  color: var(--text-faint);
  font-size: 0.76rem;
  cursor: pointer;
  transition: border-color 0.1s, color 0.1s;
  font-family: inherit;
}
.sidebar-add-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Main pane ── */
.main-pane {
  flex: 1;
  overflow-y: auto;
  min-width: 0;
}
.main-pane::-webkit-scrollbar { width: 5px; }
.main-pane::-webkit-scrollbar-track { background: transparent; }
.main-pane::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 4px; }

/* ── app-surface (exact copy from application.css) ── */
.app-surface {
  padding: 0 2rem 1.5rem;
  min-height: 100%;
  container-type: inline-size;
}

.app-surface-header {
  min-height: var(--os-header-min-height);
  margin: 0;
  display: flex;
  align-items: center;
  padding-top: 0.85rem;
  padding-bottom: var(--os-header-gap);
}

.app-surface-header--task-toolbar {
  justify-content: space-between;
  gap: 0.75rem;
}

.app-surface-header--task-toolbar .app-inline-title {
  flex: 1;
  min-width: 0;
}

.app-inline-title {
  display: inline-block;
  cursor: text;
  font-size: 1.22rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.app-inline-title-input {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--accent);
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  font-size: 1.22rem;
  font-weight: 600;
  padding: 0.2rem 0.45rem;
  outline: none;
  width: min(100%, 560px);
  display: block;
}

/* ── Icon action buttons ── */
.item-action-btn,
.row-plus,
.section-add-btn {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--nexus-icon-btn-size);
  height: var(--nexus-icon-btn-size);
  min-width: var(--nexus-icon-btn-size);
  min-height: var(--nexus-icon-btn-size);
  aspect-ratio: 1;
  padding: 0; margin: 0;
  border: none;
  border-radius: var(--nexus-icon-btn-radius);
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: inherit;
  line-height: 1;
  cursor: pointer;
  transition: color 0.12s ease, background 0.12s ease;
}

.item-action-btn .material-icon,
.row-plus .material-icon,
.section-add-btn .material-icon {
  width: var(--nexus-icon-btn-icon);
  height: var(--nexus-icon-btn-icon);
  font-size: var(--nexus-icon-btn-icon);
  flex-shrink: 0;
  display: block;
}

.item-action-btn:hover, .item-action-btn:focus-visible,
.row-plus:hover, .row-plus:focus-visible {
  color: var(--text);
  background: rgba(255,255,255,0.07);
}
.item-action-delete:hover, .item-action-delete:focus-visible {
  color: #ef4444 !important;
  background: rgba(239,68,68,0.1) !important;
}

/* ── Header add-task button ── */
.header-add-btn {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--nexus-icon-btn-size);
  height: var(--nexus-icon-btn-size);
  min-width: var(--nexus-icon-btn-size);
  min-height: var(--nexus-icon-btn-size);
  padding: 0; margin: 0;
  border: none;
  border-radius: var(--nexus-icon-btn-radius);
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  cursor: pointer;
  transition: color 0.12s ease, background 0.12s ease;
  flex-shrink: 0;
}
.header-add-btn:hover { color: var(--text); background: rgba(255,255,255,0.07); }
.header-add-btn .material-icon { font-size: var(--nexus-icon-btn-icon); }

/* ── task-list-form ── */
.task-list-form {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 0;
}

/* ── task-list-rows ── */
.task-list-rows {
  --task-text-control-height: 23.5px;
  display: flex;
  flex-direction: column;
  list-style: none;
  padding: 0;
  margin: 0;
  width: 100%;
  gap: 0 !important;
}

/* ── organizer-row ── */
.organizer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-width: 0;
}
.organizer-row-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.organizer-row-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  white-space: nowrap;
}

/* ── nexus-standard-row ── */
.nexus-standard-row {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  border-radius: 8px;
  padding: var(--nexus-row-padding-block) var(--nexus-row-padding-inline);
  min-height: calc(var(--nexus-row-padding-block) * 2 + max(18px, calc(0.82rem * 1.2 + 6px + 2px)));
  transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
}

.nexus-standard-row__main {
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
  gap: var(--nexus-row-gap);
  padding-left: 0;
  margin-left: 0;
  text-align: left;
}

.nexus-clickable-row__main {
  cursor: pointer;
  flex: 1 1 auto;
  min-width: 0;
  align-self: stretch;
}

.nexus-standard-row__leading {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 var(--nexus-list-leading-size);
  width: var(--nexus-list-leading-size);
  height: var(--nexus-list-leading-size);
  line-height: 0;
  flex-shrink: 0;
}
.nexus-standard-row__leading .task-toggle {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
.nexus-standard-row__leading .task-toggle .material-icon {
  width: 100%; height: 100%; font-size: var(--nexus-list-leading-size);
}

/* ── task-item-row ── */
.task-item-row {
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 0 !important;
  touch-action: manipulation;
  transition: background-color 140ms ease, border-color 140ms ease,
              max-height 220ms ease, opacity 180ms ease, transform 220ms ease,
              padding 220ms ease, border-width 220ms ease;
}

/* nexus-standard-row variant: no card border */
.task-item-row.nexus-standard-row {
  padding: var(--nexus-row-padding-block);
  border: none;
  transition: background 140ms ease, color 140ms ease,
              max-height 220ms ease, opacity 180ms ease, transform 220ms ease,
              padding 220ms ease;
}

.task-item-row.nexus-standard-row .organizer-row-right {
  gap: 0.35rem;
  justify-content: flex-end;
  flex: 0 0 auto !important;
  margin-left: auto !important;
}

/* Main tasks */
.task-item-row--main {
  margin-top: 0.55rem !important;
  --completion: 0;
}
.task-item-row--main:first-child { margin-top: 0 !important; }
.task-item-row--main .task-item-text { font-weight: 600; }

/* Hover tint (nexus-standard-row variant) */
.task-item-row.nexus-standard-row:not(.task-item-row--checked):hover,
.task-item-row.nexus-standard-row:not(.task-item-row--checked):focus-within {
  background: rgba(255,255,255,0.10);
}
/* Keep tint when subtasks are expanded */
.task-item-row.nexus-standard-row.task-item-row--main.task-item-group--head:not(.task-item-row--checked) {
  background: rgba(255,255,255,0.10);
}

/* Subtasks */
.task-item-row--subtask {
  margin-left: 0 !important;
  margin-top: 0 !important;
  margin-bottom: 0 !important;
  border-style: solid;
  border-color: var(--border);
  max-height: 3.4rem;
  opacity: 1;
  transform: translateY(0);
  overflow: hidden;
}
.task-item-row.nexus-standard-row.task-item-row--subtask { border: none; }

.task-item-row--subtask.is-collapsed {
  max-height: 0;
  min-height: 0 !important;
  opacity: 0;
  transform: translateY(-6px);
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  border-top-width: 0 !important;
  border-bottom-width: 0 !important;
  pointer-events: none;
}

/* Spacing between groups */
.task-item-row--main + .task-item-row--subtask { margin-top: 0 !important; }
.task-item-row--subtask + .task-item-row--main { margin-top: 0.55rem !important; }
.task-item-row--main + .task-item-row--main  { margin-top: 0.55rem !important; }

/* Group border shaping */
.task-item-group--head { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.task-item-group--child { border-top: none; border-top-width: 0 !important; border-radius: 0; }
.task-item-group--tail  { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }

/* Subtask background (nexus-standard-row) */
.task-item-row.nexus-standard-row.task-item-row--subtask:not(.is-collapsed):not(.task-item-row--checked) {
  background: rgba(255,255,255,0.05);
}
.task-item-row.nexus-standard-row.task-item-row--subtask:not(.is-collapsed).task-item-row--checked {
  background: rgba(34,197,94,0.09) !important;
}
.task-item-row.nexus-standard-row.task-item-row--subtask:not(.is-collapsed).task-item-row--checked:hover,
.task-item-row.nexus-standard-row.task-item-row--subtask:not(.is-collapsed).task-item-row--checked:focus-within {
  background: rgba(34,197,94,0.12) !important;
}

/* Checked state */
.task-item-row--checked {
  background: rgba(34,197,94,0.18) !important;
  border-color: rgba(34,197,94,0.42) !important;
}
.task-item-row.nexus-standard-row.task-item-row--checked { border: none; }
.task-item-row--checked:hover { background: rgba(34,197,94,0.24) !important; }
.task-item-row.nexus-standard-row.task-item-row--checked:hover { border: none; }
.task-item-row--checked .task-item-text { opacity: 0.75; }

/* Text */
.task-item-text,
.task-item-text--subtask {
  margin-left: 0 !important;
  font-size: var(--os-title-size);
  height: var(--task-text-control-height);
  line-height: var(--task-text-control-height);
  display: inline-flex;
  align-items: center;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-item-text--subtask { color: var(--text); }

/* Toggle icon */
.task-toggle {
  width: 1.1rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
}
.task-item-row--checked .task-toggle { color: var(--success); }

/* Action buttons: hidden by default, show on hover */
.task-item-row.nexus-standard-row .item-action-btn,
.task-item-row.nexus-standard-row .row-plus { display: none; }
.task-item-row.nexus-standard-row:hover .item-action-btn,
.task-item-row.nexus-standard-row:hover .row-plus,
.task-item-row.nexus-standard-row:focus-within .item-action-btn,
.task-item-row.nexus-standard-row:focus-within .row-plus {
  display: inline-flex; align-items: center; justify-content: center;
}
.task-item-row.is-editing .item-action-btn,
.task-item-row.is-editing .row-plus,
.task-item-row.is-editing .item-action-delete { display: none !important; }
.task-item-row.is-editing .organizer-row-right { display: none !important; }

/* Subtasks don't have add-subtask button */
.task-item-row--subtask .row-plus { display: none !important; }

/* Progress bar: visible at rest, hidden on hover */
.task-item-row .task-progress-bar,
.task-item-row .task-progress-label { display: inline-flex; }
.task-item-row:hover .task-progress-bar,
.task-item-row:hover .task-progress-label,
.task-item-row:focus-within .task-progress-bar,
.task-item-row:focus-within .task-progress-label { display: none; }
.task-item-row.is-editing .task-progress-bar,
.task-item-row.is-editing .task-progress-label { display: none; }
.task-item-row--main[data-has-subtasks="false"] .task-progress-bar,
.task-item-row--main[data-has-subtasks="false"] .task-progress-label { display: none !important; }

.task-progress-bar {
  width: 2.5rem;
  height: 0.3rem;
  display: block;
  background: rgba(255,255,255,0.08);
  border-radius: 999px;
  overflow: hidden;
  margin-right: 0;
}
.task-progress-bar-fill {
  display: block;
  height: 100%;
  width: 100%;
  background: rgba(34,197,94,0.9);
  border-radius: inherit;
  transform: scaleX(var(--completion, 0));
  transform-origin: left center;
  transition: transform 180ms ease;
  will-change: transform;
}
.task-progress-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  min-width: 2rem;
  text-align: right;
  display: none !important;
}

/* Edit input */
.task-edit-input {
  flex: 1;
  width: 100%;
  min-width: 0;
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--text);
  font: inherit;
  font-size: var(--os-title-size);
  padding: 0 0.5rem;
  height: var(--task-text-control-height);
  line-height: var(--task-text-control-height);
  box-sizing: border-box;
  outline: none;
}
.task-item-row--subtask .task-edit-input { font-size: 0.93rem; font-weight: 400; }
.task-item-row--main.nexus-standard-row.is-editing .nexus-standard-row__main {
  padding-right: 0.08rem !important;
}
.task-item-row.nexus-standard-row .nexus-clickable-row__main {
  flex: 1 1 auto !important; min-width: 0 !important;
}

/* Empty state */
.task-list-empty {
  padding: 2.5rem 1rem;
  text-align: center;
  color: var(--text-faint);
  font-size: 0.8rem;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>Task Lists</h1>
  </div>
  <div class="sidebar-lists" id="sidebar-lists"></div>
  <div class="sidebar-add">
    <button class="sidebar-add-btn" id="new-list-btn">
      <span class="material-icon material-icon--xs">add</span>
      New list
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main-pane">
  <div class="app-surface" id="app-surface">
    <!-- rendered by JS -->
  </div>
</main>

<script>
// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
let lists = JSON.parse(localStorage.getItem('nx_task_lists') || 'null') || [
  {
    id: 1, name: 'Nexus Dev',
    tasks: [
      { text: 'Build calendar app', checked: true,  subtasks: [] },
      { text: 'Strip legacy apps',  checked: true,  subtasks: [] },
      { text: 'Add year view',      checked: true,  subtasks: [] },
      {
        text: 'Dashboard', checked: false,
        subtasks: [
          { text: 'Wireframe layout',     checked: true  },
          { text: 'Recent docs widget',   checked: false },
          { text: 'Tasks today widget',   checked: false },
        ]
      },
      { text: 'Journal app', checked: false, subtasks: [] },
    ]
  },
  {
    id: 2, name: 'Personal',
    tasks: [
      { text: 'Groceries', checked: false, subtasks: [
        { text: 'Eggs',   checked: true  },
        { text: 'Coffee', checked: false },
        { text: 'Bread',  checked: false },
      ]},
      { text: 'Read 30 minutes', checked: true,  subtasks: [] },
      { text: 'Gym',             checked: false, subtasks: [] },
    ]
  },
  {
    id: 3, name: 'Ideas',
    tasks: [
      { text: 'Widget layer for Nexus', checked: false, subtasks: [] },
      { text: 'Quick capture inbox',    checked: false, subtasks: [] },
      { text: 'Kanban board',           checked: false, subtasks: [] },
    ]
  },
];
let nextListId = lists.length ? Math.max(...lists.map(l => l.id)) + 1 : 1;
let activeListId = lists[0]?.id ?? null;

function save() {
  localStorage.setItem('nx_task_lists', JSON.stringify(lists));
}

function activeList() {
  return lists.find(l => l.id === activeListId) || null;
}

// ══════════════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════════════
function renderSidebar() {
  const el = document.getElementById('sidebar-lists');
  el.innerHTML = '';
  lists.forEach(list => {
    const btn = document.createElement('button');
    btn.className = 'sidebar-list-item' + (list.id === activeListId ? ' active' : '');
    btn.innerHTML = `<span class="list-dot"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(list.name)}</span>`;
    btn.onclick = () => { activeListId = list.id; render(); };
    el.appendChild(btn);
  });
}

document.getElementById('new-list-btn').onclick = () => {
  const name = prompt('List name:');
  if (!name?.trim()) return;
  const list = { id: nextListId++, name: name.trim(), tasks: [] };
  lists.push(list);
  activeListId = list.id;
  save();
  render();
};

// ══════════════════════════════════════════════════════
// MAIN RENDER
// ══════════════════════════════════════════════════════
function render() {
  renderSidebar();
  renderTaskList();
}

function renderTaskList() {
  const surface = document.getElementById('app-surface');
  const list = activeList();

  if (!list) {
    surface.innerHTML = '<div class="task-list-empty">No list selected.</div>';
    return;
  }

  surface.innerHTML = '';

  // Header
  const header = document.createElement('header');
  header.className = 'app-surface-header app-surface-header--task-toolbar';

  const titleWrap = document.createElement('h2');
  titleWrap.className = 'app-inline-title';
  titleWrap.title = 'Click to rename';
  const titleSpan = document.createElement('span');
  titleSpan.textContent = list.name;
  titleWrap.appendChild(titleSpan);
  titleWrap.onclick = (e) => {
    if (titleWrap.querySelector('input')) return;
    const input = document.createElement('input');
    input.className = 'app-inline-title-input';
    input.value = list.name;
    titleWrap.replaceChildren(input);
    input.focus(); input.select();
    const finish = () => {
      const val = input.value.trim() || list.name;
      list.name = val;
      save();
      render();
    };
    input.onblur = finish;
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { input.blur(); }
      if (e.key === 'Escape') { input.value = list.name; input.blur(); }
    };
  };

  const addBtn = document.createElement('button');
  addBtn.className = 'header-add-btn';
  addBtn.title = 'Add task';
  addBtn.setAttribute('aria-label', 'Add task');
  addBtn.innerHTML = `<span class="material-icon material-icon--xs">add</span>`;
  addBtn.onclick = () => addTask();

  header.appendChild(titleWrap);
  header.appendChild(addBtn);
  surface.appendChild(header);

  // Form / list
  const form = document.createElement('div');
  form.className = 'task-list-form';

  const ul = document.createElement('ul');
  ul.className = 'task-list-rows';
  ul.id = 'task-rows';

  if (!list.tasks.length) {
    const empty = document.createElement('li');
    empty.className = 'task-list-empty';
    empty.textContent = 'No tasks yet. Click + to add one.';
    ul.appendChild(empty);
  } else {
    list.tasks.forEach((task, taskIdx) => {
      const mainRow = buildMainRow(task, taskIdx);
      ul.appendChild(mainRow);

      task.subtasks.forEach((sub, subIdx) => {
        const subRow = buildSubRow(sub, taskIdx, subIdx, task.subtasks.length);
        if (task._collapsed) subRow.classList.add('is-collapsed');
        ul.appendChild(subRow);
      });
    });
  }

  // Wire clicks
  ul.addEventListener('click', handleListClick);
  ul.addEventListener('keydown', handleListKeydown);

  form.appendChild(ul);
  surface.appendChild(form);

  refreshAll();
}

// ══════════════════════════════════════════════════════
// BUILD ROWS
// ══════════════════════════════════════════════════════
function buildMainRow(task, taskIdx) {
  const row = document.createElement('li');
  row.className = 'task-item-row task-item-row--main organizer-row nexus-standard-row';
  row.dataset.taskIdx = taskIdx;
  row.dataset.role = 'main-task';
  row.dataset.mainChecked = task.checked ? 'true' : 'false';
  row.dataset.collapsed = task._collapsed ? 'true' : 'false';
  row.dataset.hasSubtasks = task.subtasks.length > 0 ? 'true' : 'false';
  row.style.setProperty('--completion', subtaskCompletion(task));

  row.innerHTML =
    `<div class="organizer-row-left nexus-standard-row__main nexus-clickable-row__main">` +
      `<span class="nexus-standard-row__leading">` +
        `<span class="task-toggle" role="button" tabindex="0" aria-label="Toggle">${toggleIcon(task.checked)}</span>` +
      `</span>` +
      `<span class="task-item-text" data-role="task-text">${esc(task.text)}</span>` +
    `</div>` +
    `<div class="organizer-row-right">` +
      `<span class="task-progress-bar" aria-hidden="true"><span class="task-progress-bar-fill"></span></span>` +
      `<span class="task-progress-label"></span>` +
      `<button class="row-plus item-action-btn" title="Add subtask"><span class="material-icon material-icon--xs">add</span></button>` +
      `<button class="item-action-btn" data-action="rename" title="Rename"><span class="material-icon material-icon--xs">edit</span></button>` +
      `<button class="item-action-btn item-action-delete" title="Delete"><span class="material-icon material-icon--xs">delete</span></button>` +
    `</div>`;

  return row;
}

function buildSubRow(sub, taskIdx, subIdx, totalSubs) {
  const row = document.createElement('li');
  row.className = 'task-item-row task-item-row--subtask organizer-row nexus-standard-row task-item-group--child';
  if (sub.checked) row.classList.add('task-item-row--checked');
  if (subIdx === totalSubs - 1) row.classList.add('task-item-group--tail');
  row.dataset.taskIdx = taskIdx;
  row.dataset.subIdx = subIdx;
  row.dataset.role = 'subtask';

  row.innerHTML =
    `<div class="organizer-row-left nexus-standard-row__main nexus-clickable-row__main">` +
      `<span class="nexus-standard-row__leading">` +
        `<span class="task-toggle" role="button" tabindex="0" aria-label="Toggle">${toggleIcon(sub.checked)}</span>` +
      `</span>` +
      `<span class="task-item-text task-item-text--subtask" data-role="task-text">${esc(sub.text)}</span>` +
    `</div>` +
    `<div class="organizer-row-right">` +
      `<button class="item-action-btn" data-action="rename" title="Rename"><span class="material-icon material-icon--xs">edit</span></button>` +
      `<button class="item-action-btn item-action-delete" title="Delete"><span class="material-icon material-icon--xs">delete</span></button>` +
    `</div>`;

  return row;
}

function toggleIcon(checked) {
  return checked
    ? `<span class="material-icon material-icon--xs">check</span>`
    : `<span class="material-icon material-icon--xs">radio_button_unchecked</span>`;
}

// ══════════════════════════════════════════════════════
// CLICK HANDLER
// ══════════════════════════════════════════════════════
function handleListClick(e) {
  const row = e.target.closest('.task-item-row');
  if (!row) return;

  // Commit any active edit first (unless clicking within same row)
  if (!row.contains(document.activeElement)) commitActiveEdit(row);
  if (row.querySelector('.task-edit-input')) return;

  // Add subtask button
  if (e.target.closest('.row-plus')) {
    e.preventDefault(); e.stopPropagation();
    addSubtask(row); return;
  }
  // Delete
  if (e.target.closest('.item-action-delete')) {
    e.preventDefault(); e.stopPropagation();
    removeTask(row); return;
  }
  // Rename
  if (e.target.closest('[data-action="rename"]')) {
    e.preventDefault(); e.stopPropagation();
    startEdit(row); return;
  }

  e.preventDefault();

  // Main task with subtasks → toggle collapse
  if (row.classList.contains('task-item-row--main')) {
    const taskIdx = +row.dataset.taskIdx;
    const task = activeList().tasks[taskIdx];
    if (task.subtasks.length > 0) {
      task._collapsed = !task._collapsed;
      save();
      render(); return;
    }
    // Toggle checked
    task.checked = !task.checked;
    save();
    refreshAll(); return;
  }

  // Subtask
  if (row.classList.contains('task-item-row--subtask')) {
    const taskIdx = +row.dataset.taskIdx;
    const subIdx  = +row.dataset.subIdx;
    const sub = activeList().tasks[taskIdx].subtasks[subIdx];
    sub.checked = !sub.checked;
    save();
    refreshAll(); return;
  }
}

function handleListKeydown(e) {
  const input = e.target.closest('.task-edit-input');
  if (!input) return;
  if (e.key === 'Enter') { e.preventDefault(); finishEdit(input, true); }
  if (e.key === 'Escape') { e.preventDefault(); finishEdit(input, false); }
}

// ══════════════════════════════════════════════════════
// TASK OPERATIONS
// ══════════════════════════════════════════════════════
function addTask() {
  const list = activeList(); if (!list) return;
  list.tasks.push({ text: '', checked: false, subtasks: [] });
  save();
  render();
  // Start editing the new row
  const rows = document.querySelectorAll('.task-item-row--main');
  const last = rows[rows.length - 1];
  if (last) startEdit(last);
}

function addSubtask(mainRow) {
  const taskIdx = +mainRow.dataset.taskIdx;
  const task = activeList().tasks[taskIdx];
  task.subtasks.push({ text: '', checked: false });
  task._collapsed = false;
  save();
  render();
  // Start editing new subtask
  const subRows = document.querySelectorAll(`[data-task-idx="${taskIdx}"][data-role="subtask"]`);
  const last = subRows[subRows.length - 1];
  if (last) startEdit(last);
}

function removeTask(row) {
  const list = activeList(); if (!list) return;
  const taskIdx = +row.dataset.taskIdx;

  if (row.classList.contains('task-item-row--main')) {
    const taskName = row.querySelector('[data-role="task-text"]')?.textContent?.trim() || 'task';
    if (!confirm(`Delete "${taskName}"?`)) return;
    list.tasks.splice(taskIdx, 1);
  } else {
    const subIdx = +row.dataset.subIdx;
    list.tasks[taskIdx].subtasks.splice(subIdx, 1);
    if (list.tasks[taskIdx].subtasks.length === 0) {
      list.tasks[taskIdx]._collapsed = false;
    }
  }
  save(); render();
}

// ══════════════════════════════════════════════════════
// INLINE EDIT
// ══════════════════════════════════════════════════════
function startEdit(row) {
  commitActiveEdit(row);

  row.classList.add('is-editing');
  const textNode = row.querySelector('[data-role="task-text"]');
  if (!textNode) return;

  const original = textNode.textContent.trim();
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'task-edit-input';
  input.value = original;
  input.dataset.original = original;
  input.placeholder = row.classList.contains('task-item-row--subtask') ? 'Subtask...' : 'Task...';
  textNode.replaceWith(input);
  input.focus(); input.select();
  input.addEventListener('blur', () => finishEdit(input, true), { once: true });
}

function finishEdit(input, save) {
  const row = input.closest('.task-item-row');
  if (!row) return;

  const original = (input.dataset.original || '').trim();
  let value = save ? input.value.trim() : original;
  if (save && !value) value = original;

  row.classList.remove('is-editing');

  if (!value) {
    // New empty row — remove it
    const list = activeList(); if (!list) return;
    const taskIdx = +row.dataset.taskIdx;
    if (row.classList.contains('task-item-row--main')) {
      list.tasks.splice(taskIdx, 1);
    } else {
      list.tasks[taskIdx].subtasks.splice(+row.dataset.subIdx, 1);
    }
    save_(); render(); return;
  }

  // Persist value
  const list = activeList(); if (!list) { render(); return; }
  const taskIdx = +row.dataset.taskIdx;
  if (row.classList.contains('task-item-row--main')) {
    list.tasks[taskIdx].text = value;
  } else {
    list.tasks[taskIdx].subtasks[+row.dataset.subIdx].text = value;
  }
  save_();

  const text = document.createElement('span');
  text.dataset.role = 'task-text';
  text.className = row.classList.contains('task-item-row--subtask')
    ? 'task-item-text task-item-text--subtask'
    : 'task-item-text';
  text.textContent = value;
  input.replaceWith(text);
  refreshAll();
}

function commitActiveEdit(excludeRow) {
  const input = document.querySelector('.task-edit-input');
  if (!input) return;
  if (excludeRow && excludeRow.contains(input)) return;
  finishEdit(input, true);
}

// ══════════════════════════════════════════════════════
// REFRESH (sync CSS state from data)
// ══════════════════════════════════════════════════════
function refreshAll() {
  const list = activeList(); if (!list) return;
  const ul = document.getElementById('task-rows'); if (!ul) return;

  list.tasks.forEach((task, taskIdx) => {
    const mainRow = ul.querySelector(`[data-task-idx="${taskIdx}"][data-role="main-task"]`);
    if (!mainRow) return;

    const subRows = Array.from(ul.querySelectorAll(`[data-task-idx="${taskIdx}"][data-role="subtask"]`));
    const total = subRows.length;
    const checked = subRows.filter(r => r.classList.contains('task-item-row--checked')).length;
    const isCollapsed = task._collapsed && total > 0;
    const completion = total > 0 ? checked / total : (task.checked ? 1 : 0);

    mainRow.dataset.hasSubtasks = total > 0 ? 'true' : 'false';
    mainRow.dataset.collapsed = isCollapsed ? 'true' : 'false';
    mainRow.style.setProperty('--completion', completion);

    if (total > 0) {
      const allDone = subRows.every(r => r.classList.contains('task-item-row--checked'));
      task.checked = allDone;
      mainRow.dataset.mainChecked = allDone ? 'true' : 'false';
      mainRow.classList.toggle('task-item-row--checked', allDone);
    } else {
      mainRow.classList.toggle('task-item-row--checked', task.checked);
      mainRow.dataset.mainChecked = task.checked ? 'true' : 'false';
    }

    // Toggle icon
    const toggle = mainRow.querySelector('.task-toggle');
    if (toggle) toggle.innerHTML = toggleIcon(task.checked);

    // Progress label
    const label = mainRow.querySelector('.task-progress-label');
    if (label) label.textContent = total > 0 ? `${checked}/${total}` : '';

    // Group classes
    mainRow.classList.toggle('task-item-group--head', total > 0 && !isCollapsed);
    mainRow.classList.toggle('task-item-group--tail', total === 0 || isCollapsed);

    // Subtask rows
    subRows.forEach((sr, i) => {
      sr.classList.toggle('is-collapsed', isCollapsed);
      sr.setAttribute('aria-hidden', isCollapsed ? 'true' : 'false');
      sr.classList.toggle('task-item-group--tail', i === total - 1 && !isCollapsed);
      const st = task.subtasks[i];
      if (st) {
        sr.classList.toggle('task-item-row--checked', st.checked);
        const stToggle = sr.querySelector('.task-toggle');
        if (stToggle) stToggle.innerHTML = toggleIcon(st.checked);
      }
    });
  });
}

function subtaskCompletion(task) {
  const t = task.subtasks.length;
  if (!t) return task.checked ? 1 : 0;
  return task.subtasks.filter(s => s.checked).length / t;
}

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function save_() { save(); }

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
render();
</script>
</body>
</html>
